<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurateur Macropad 3D (USB)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        button { background: #00e676; color: #000; font-weight: bold; border: none; padding: 14px 28px; border-radius: 8px; cursor: pointer; font-size: 1em; }
        button:hover { background: #00c853; }
        .status { font-weight: 500; margin-top: 15px; color: #ffa726; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; max-width: 700px; margin: 30px auto; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 12px; }
        .card h3 { margin-top: 0; color: #00e676; }
        .card input { width: 85%; padding: 10px; margin-top: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>

    <h1>🎛️ Configurateur Macropad</h1>
    <p style="color:#888;">Branche l'ESP32 en USB pour configurer les touches</p>
    
    <button id="connectBtn">Se connecter en USB (Série)</button>
    <p class="status" id="status">Statut : Non connecté</p>

    <div class="grid" id="keysContainer"></div>

    <script>
        let port = null;
        let writer = null;

        const container = document.getElementById('keysContainer');
        for (let i = 0; i < 8; i++) {
            container.innerHTML += `
                <div class="card">
                    <h3>Touche ${i + 1}</h3>
                    <input type="text" id="key-${i}" placeholder="Ex: CTRL+C" onchange="sendMacro(${i})">
                </div>
            `;
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            if (!("serial" in navigator)) {
                alert("Votre navigateur ne supporte pas le Web Serial (utilisez Chrome ou Edge sur PC).");
                return;
            }

            try {
                // Demande à l'utilisateur de choisir le port COM (ex: CP2102)
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                writer = port.writable.getWriter();

                statusEl.innerText = "🟢 Connecté en USB à l'ESP32 !";
                statusEl.style.color = "#00e676";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "🔴 Erreur de connexion USB : " + err.message;
                statusEl.style.color = "#ff5252";
            }
        });

        async function sendMacro(index) {
            if (!writer) {
                alert("Veuillez d'abord connecter l'ESP32 en USB.");
                return;
            }
            const value = document.getElementById(`key-${index}`).value;
            const payload = `SET:${index}:${value}\n`;
            
            const encoder = new TextEncoder();
            await writer.write(encoder.encode(payload));
            console.log("Envoyé via USB :", payload);
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
